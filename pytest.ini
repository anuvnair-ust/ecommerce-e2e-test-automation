[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --html=reports/report.html --self-contained-html
markers =
    ui: browser based UI scenarios
    api: REST API scenarios
    smoke: quick sanity coverage
    regression: full functional coverage
    negative: invalid input and unsupported method checks
filterwarnings =
    ignore::pytest.PytestRemovedIn10Warning
